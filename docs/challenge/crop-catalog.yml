      source: Lujan & Riglos 2024, UNSL thesis, Villa Mercedes EEA San Luis, 1 campaign (2018/19), rainfed (https://dspace.fica.unsl.edu.ar/bitstreams/8782a593-103e-4b31-a677-9f4f53394f35/download)
