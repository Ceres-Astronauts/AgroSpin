version: 1
catalog_id: field_shift_minimal_crop_catalog
status: DRAFT_PARTIAL_PARAMETERS_KC_ZR_CYCLE_SOWING_PARTIAL
created_at: 2026-11-14
scope:
  anchor: EEA INTA San Luis (Villa Mercedes, -33.6500, -65.3667)
  purpose: candidate crops for rotation comparison; parameters are not usable until extracted and validated
rule:
  usable_in_model: false
  note: Kc values come from FAO-56 Table 12 only; Zr (FAO-56 Table 22) is loaded; sowing windows are verified only for maize and sorghum (trial-specific); cycle days and yield means come from Riglos 2023
    as trial means; rotations remain NO_VERIFICADO. A crop becomes usable only when its water, cycle and rotation parameters are extracted from a registered source and validated at the required E level.
    Presence in a source is not a parameter.
priority_criteria:
  1: local_evidence_registered_in_field_shift_context
  2: regional_prominence_in_secondary_sources
  3: relevance_to_water_stress_rotation_decision
