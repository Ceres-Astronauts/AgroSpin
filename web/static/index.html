<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Field Shift — Asistente de Rotación</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 text-stone-900 min-h-screen antialiased">
  <header class="bg-emerald-800 text-white shadow-sm">
    <div class="max-w-xl mx-auto px-4 py-4">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-xl font-bold tracking-tight">🌱 Field Shift</h1>
          <p class="text-emerald-100 text-sm">Villa Mercedes, San Luis · Ceres Agronauts</p>
        </div>
        <span class="text-xs bg-emerald-700 px-2.5 py-1 rounded-full font-medium">Piloto Campo</span>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-5 space-y-5">
    <section class="bg-white rounded-2xl shadow-sm border border-stone-200 p-4 sm:p-5 space-y-5">
      <div>
        <h2 class="text-lg font-bold text-stone-800">Contanos cómo está tu lote hoy</h2>
        <p class="text-sm text-stone-500">Completá estas casillas simples para ver qué rotación te conviene.</p>
      </div>

      <form id="form-lote" class="space-y-5">
        <!-- 1. Lote / Zona -->
        <div>
          <label for="lote_id" class="block text-sm font-semibold text-stone-700 mb-1.5">1. Ubicación / Lote</label>
          <select id="lote_id" name="lote_id" class="w-full rounded-xl border border-stone-300 bg-stone-50 px-3.5 py-3 text-base focus:outline-none focus:ring-2 focus:ring-emerald-600">
            <option value="villa_mercedes_centro">Villa Mercedes — Lote Piloto</option>
          </select>
        </div>

        <!-- 2. Humedad del suelo -->
        <div>
          <span class="block text-sm font-semibold text-stone-700 mb-1.5">2. ¿Cómo ves la humedad del suelo?</span>
          <div class="grid grid-cols-2 gap-2.5">
            <label class="cursor-pointer">
              <input type="radio" name="humedad_estado" value="seco" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-3 text-center peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                🏜️ Seco
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="humedad_estado" value="normal" class="peer sr-only" checked />
              <div class="rounded-xl border border-stone-300 p-3 text-center peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                🌤️ Normal
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="humedad_estado" value="humedo" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-3 text-center peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                💧 Húmedo
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="humedad_estado" value="sonda" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-3 text-center peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                📡 Tengo sonda
              </div>
            </label>
          </div>

          <!-- Casillas opcionales de sonda -->
          <div id="box-sonda" class="hidden mt-3 grid grid-cols-3 gap-2 bg-stone-50 p-3 rounded-xl border border-stone-200">
            <div>
              <label class="block text-xs text-stone-600 mb-1">10 cm (m³/m³)</label>
              <input type="number" step="0.01" min="0.05" max="0.45" id="sonda_10cm" value="0.17" class="w-full rounded-lg border border-stone-300 px-2.5 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs text-stone-600 mb-1">30 cm (m³/m³)</label>
              <input type="number" step="0.01" min="0.05" max="0.45" id="sonda_30cm" value="0.21" class="w-full rounded-lg border border-stone-300 px-2.5 py-2 text-sm" />
            </div>
            <div>
              <label class="block text-xs text-stone-600 mb-1">60 cm (m³/m³)</label>
              <input type="number" step="0.01" min="0.05" max="0.45" id="sonda_60cm" value="0.23" class="w-full rounded-lg border border-stone-300 px-2.5 py-2 text-sm" />
            </div>
          </div>
        </div>

        <!-- 3. Estado del lote -->
        <div>
          <span class="block text-sm font-semibold text-stone-700 mb-1.5">3. ¿Qué hay hoy en el lote?</span>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="estado_lote" value="rastrojo" class="peer sr-only" checked />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                🌾 Rastrojo
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="estado_lote" value="desnudo" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                🟫 Desnudo
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="estado_lote" value="pastura" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                🌿 Pastura
              </div>
            </label>
          </div>
        </div>

        <!-- 4. Tipo de año esperado -->
        <div>
          <span class="block text-sm font-semibold text-stone-700 mb-1.5">4. ¿Qué año esperás de lluvias?</span>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="escenario_lluvia" value="seco" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                ☀️ Año seco
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="escenario_lluvia" value="normal" class="peer sr-only" checked />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                ⛅ Normal
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="escenario_lluvia" value="humedo" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                🌧️ Húmedo
              </div>
            </label>
          </div>
        </div>

        <!-- 5. Prioridad -->
        <div>
          <span class="block text-sm font-semibold text-stone-700 mb-1.5">5. ¿Qué priorizás esta campaña?</span>
          <div class="grid grid-cols-3 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="prioridad" value="agua" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                💧 Cuidar agua
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="prioridad" value="suelo" class="peer sr-only" checked />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                🌱 Cuidar suelo
              </div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="prioridad" value="renta" class="peer sr-only" />
              <div class="rounded-xl border border-stone-300 p-2.5 text-center text-sm peer-checked:border-emerald-600 peer-checked:bg-emerald-50 peer-checked:font-semibold">
                💰 Rentabilidad
              </div>
            </label>
          </div>
        </div>

        <!-- 6. Ganadería -->
        <label class="flex items-center gap-3 p-3 rounded-xl bg-stone-50 border border-stone-200 cursor-pointer">
          <input type="checkbox" id="tiene_ganaderia" class="w-5 h-5 accent-emerald-700 rounded" />
          <span class="text-sm font-medium text-stone-800">Tengo hacienda / ganadería en el campo</span>
        </label>

        <button type="submit" id="btn-evaluar" class="w-full bg-emerald-700 hover:bg-emerald-800 active:bg-emerald-900 text-white font-bold text-base py-3.5 rounded-xl shadow-sm transition">
          Ver recomendación para mi lote
        </button>
      </form>
    </section>

    <!-- Resultados -->
    <section id="resultados" class="hidden space-y-4">
      <div id="alerta-lote" class="rounded-2xl bg-amber-50 border border-amber-200 p-4 text-sm text-amber-900 font-medium"></div>

      <div id="tarjetas-container" class="space-y-3"></div>

      <!-- Botón desplegable opcional -->
      <div class="bg-white rounded-2xl border border-stone-200 shadow-sm overflow-hidden">
        <button type="button" id="btn-detalle" class="w-full flex items-center justify-between px-4 py-3.5 text-sm font-semibold text-stone-700 hover:bg-stone-50">
          <span>📊 Ver detalle técnico</span>
          <span id="icono-detalle">▼</span>
        </button>
        <div id="panel-detalle" class="hidden border-t border-stone-200 px-4 py-3.5 bg-stone-50 text-sm space-y-2 text-stone-700"></div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById("form-lote");
    const boxSonda = document.getElementById("box-sonda");
    const resultados = document.getElementById("resultados");
    const tarjetasContainer = document.getElementById("tarjetas-container");
    const alertaLote = document.getElementById("alerta-lote");
    const btnDetalle = document.getElementById("btn-detalle");
    const panelDetalle = document.getElementById("panel-detalle");
    const iconoDetalle = document.getElementById("icono-detalle");

    document.querySelectorAll('input[name="humedad_estado"]').forEach((el) => {
      el.addEventListener("change", (e) => {
        boxSonda.classList.toggle("hidden", e.target.value !== "sonda");
      });
    });

    btnDetalle.addEventListener("click", () => {
      const oculto = panelDetalle.classList.toggle("hidden");
      iconoDetalle.textContent = oculto ? "▼" : "▲";
    });

    async function cargarLotes() {
      try {
        const res = await fetch("/api/lotes");
        if (!res.ok) return;
        const data = await res.json();
        const select = document.getElementById("lote_id");
        if (data.lotes && data.lotes.length > 0) {
          select.innerHTML = data.lotes
            .map((l) => `<option value="${l.id}">${l.nombre} (${l.suelo})</option>`)
            .join("");
        }
      } catch (_) {}
    }

    const SEMAFORO_ESTILOS = {
      recomendado: {
        borde: "border-emerald-500 bg-white",
        badge: "bg-emerald-100 text-emerald-800",
        texto: "🟢 Recomendado",
      },
      precaucion: {
        borde: "border-amber-400 bg-white",
        badge: "bg-amber-100 text-amber-800",
        texto: "🟡 Precaución",
      },
      no_recomendado: {
        borde: "border-rose-400 bg-white",
        badge: "bg-rose-100 text-rose-800",
        texto: "🔴 No recomendado",
      },
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const humedad = document.querySelector('input[name="humedad_estado"]:checked').value;
      const payload = {
        lote_id: document.getElementById("lote_id").value,
        humedad_estado: humedad,
        sonda_10cm: humedad === "sonda" ? parseFloat(document.getElementById("sonda_10cm").value) : null,
        sonda_30cm: humedad === "sonda" ? parseFloat(document.getElementById("sonda_30cm").value) : null,
        sonda_60cm: humedad === "sonda" ? parseFloat(document.getElementById("sonda_60cm").value) : null,
        estado_lote: document.querySelector('input[name="estado_lote"]:checked').value,
        escenario_lluvia: document.querySelector('input[name="escenario_lluvia"]:checked').value,
        prioridad: document.querySelector('input[name="prioridad"]:checked').value,
        tiene_ganaderia: document.getElementById("tiene_ganaderia").checked,
      };

      const res = await fetch("/api/evaluar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await res.json();

      alertaLote.textContent = `📌 ${data.lote} (${data.suelo}): ${data.alerta_principal}`;

      tarjetasContainer.innerHTML = data.tarjetas
        .map((t) => {
          const est = SEMAFORO_ESTILOS[t.semaforo] || SEMAFORO_ESTILOS.precaucion;
          const alertasHtml = (t.alertas || []).length
            ? `<ul class="mt-2 text-xs text-stone-600 list-disc list-inside space-y-0.5">${t.alertas.map((a) => `<li>${a}</li>`).join("")}</ul>`
            : "";
          return `
            <article class="rounded-2xl border-l-4 ${est.borde} p-4 shadow-sm border border-stone-200">
              <div class="flex items-start justify-between gap-2">
                <h3 class="font-bold text-base text-stone-900">${t.nombre}</h3>
                <span class="shrink-0 text-xs font-bold px-2.5 py-1 rounded-full ${est.badge}">${est.texto}</span>
              </div>
              <p class="mt-1.5 text-sm text-stone-600">${t.resumen}</p>
              ${alertasHtml}
            </article>
          `;
        })
        .join("");

      const dt = data.detalle_tecnico;
      panelDetalle.innerHTML = `
        <div class="grid grid-cols-2 gap-2">
          <div><span class="text-stone-500">Lluvia proyectada:</span> <strong>${dt.lluvia_anual_proyectada_mm} mm/año</strong></div>
          <div><span class="text-stone-500">Humedad efectiva:</span> <strong>${dt.humedad_efectiva_m3_m3} m³/m³</strong></div>
          <div><span class="text-stone-500">Pico térmico:</span> <strong>${dt.pico_termico_c} °C</strong></div>
          <div><span class="text-stone-500">Meses suelo desnudo:</span> <strong>${dt.meses_suelo_desnudo}</strong></div>
        </div>
        <div class="pt-1 text-xs text-stone-500">Fuente humedad: ${dt.fuente_humedad} (±${dt.incertidumbre_pct}%)</div>
      `;

      resultados.classList.remove("hidden");
      resultados.scrollIntoView({ behavior: "smooth" });
    });

    cargarLotes();
  </script>
</body>
</html>
